name: Release signed APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        run: |
          mkdir -p "$RUNNER_TEMP"
          echo "${{ secrets.SNAPTTL_KEYSTORE_B64 }}" | base64 -d > snapttl-release.keystore
          ls -l snapttl-release.keystore

      - name: Assemble signed release
        env:
          SNAPTTL_KEYSTORE_FILE: snapttl-release.keystore
          SNAPTTL_KEYSTORE_PASSWORD: ${{ secrets.SNAPTTL_KEYSTORE_PASSWORD }}
          SNAPTTL_KEY_ALIAS: ${{ secrets.SNAPTTL_KEY_ALIAS }}
          SNAPTTL_KEY_PASSWORD: ${{ secrets.SNAPTTL_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -Psnapttl.keystoreFile="$SNAPTTL_KEYSTORE_FILE" \
            -Psnapttl.storePassword="$SNAPTTL_KEYSTORE_PASSWORD" \
            -Psnapttl.keyAlias="$SNAPTTL_KEY_ALIAS" \
            -Psnapttl.keyPassword="$SNAPTTL_KEY_PASSWORD"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: snapttl-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
