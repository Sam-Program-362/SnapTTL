name: Release signed APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        run: |
          mkdir -p "$RUNNER_TEMP"
          echo "${{ secrets.SNAPTTL_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/snapttl-release.keystore"
          ls -l "$RUNNER_TEMP/snapttl-release.keystore"

      - name: Assemble signed release
        env:
          SNAPTTL_KEYSTORE_PASSWORD: ${{ secrets.SNAPTTL_KEYSTORE_PASSWORD }}
          SNAPTTL_KEY_ALIAS: ${{ secrets.SNAPTTL_KEY_ALIAS }}
          SNAPTTL_KEY_PASSWORD: ${{ secrets.SNAPTTL_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --console=plain --stacktrace \
            -Psnapttl.keystoreFile="$RUNNER_TEMP/snapttl-release.keystore" \
            -Psnapttl.storePassword="$SNAPTTL_KEYSTORE_PASSWORD" \
            -Psnapttl.keyAlias="$SNAPTTL_KEY_ALIAS" \
            -Psnapttl.keyPassword="$SNAPTTL_KEY_PASSWORD"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: snapttl-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to the tag release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release upload "${GITHUB_REF_NAME}" app/build/outputs/apk/release/*.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
