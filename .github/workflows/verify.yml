name: Verify

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests · lint · debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Clean-room core tests (Python mirror)
        run: python3 -m unittest discover -s tools -p 'clean_room_core_tests.py' -v

      - name: Unit tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain > /tmp/unit-tests.log 2>&1
          status=$?
          tail -n 120 /tmp/unit-tests.log
          echo "gradle_exit=$status" >> "$GITHUB_OUTPUT"
          exit $status
        id: unit-tests

      - name: Report test failure on the PR
        if: failure()
        run: |
          set +e
          if [ -f /tmp/unit-tests.log ]; then
            grep -nE "^e: |error:|FAILED|Execution failed|What went wrong|Unresolved|Caused by|BUILD FAILED" \
              /tmp/unit-tests.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          {
            echo "### SnapTTL — unit test failure"
            echo ""
            echo '```text'
            tail -n 200 /tmp/unit-tests.log 2>/dev/null
            echo '```'
          } > /tmp/report.md
          NUMBER="${{ github.event.pull_request.number }}"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "${{ github.repository }}" --body "$(cat /tmp/report.md)" || true
          fi

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: Room schema export
        run: |
          ./gradlew :app:kspDebugKotlin --no-daemon --console=plain
          test -f app/schemas/dev.snapttl.data.expiry.ExpiryDatabase/1.json
          test -f app/schemas/dev.snapttl.data.search.SearchIndexDatabase/1.json
          echo "--- Room schemas ---"
          ls -1 app/schemas

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Packaged permission audit
        run: |
          ./gradlew :app:processDebugMainManifest --no-daemon --console=plain
          echo "--- merged manifest permissions ---"
          grep -o 'android.permission\.[A-Z_]*' \
            app/build/intermediates/merged_manifest/debug/AndroidManifest.xml | sort -u

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: snapttl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
