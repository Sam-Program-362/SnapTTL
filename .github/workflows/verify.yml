name: Verify

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests · lint · debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Clean-room core tests (Python mirror)
        run: python3 -m unittest discover -s tools -p 'clean_room_core_tests.py' -v

      - name: Unit tests (JUnit + Robolectric, SDK 30/34/35)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: Room schema export
        run: |
          ./gradlew :app:kspDebugKotlin --no-daemon --console=plain
          test -f app/schemas/dev.snapttl.data.expiry.ExpiryDatabase/1.json
          test -f app/schemas/dev.snapttl.data.search.SearchIndexDatabase/1.json
          echo "--- Room schemas ---"
          ls -1 app/schemas/*/

      - name: Upload Room schemas
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: error

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Packaged permission audit
        run: |
          ./gradlew :app:processDebugMainManifest --no-daemon --console=plain
          echo "--- merged manifest permissions ---"
          GOT=$(grep -o 'android.permission\.[A-Z_]*' \
            app/build/intermediates/merged_manifest/debug/AndroidManifest.xml | sort -u)
          echo "$GOT"
          EXPECTED=$(printf '%s\n' \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_SPECIAL_USE \
            android.permission.POST_NOTIFICATIONS \
            android.permission.READ_MEDIA_IMAGES \
            android.permission.READ_MEDIA_VISUAL_USER_SELECTED \
            android.permission.READ_EXTERNAL_STORAGE \
            android.permission.RECEIVE_BOOT_COMPLETED \
            android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS \
            android.permission.SYSTEM_ALERT_WINDOW \
            android.permission.VIBRATE \
            android.permission.WAKE_LOCK | sort -u)
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::Packaged permission set drifted from the reviewed allowlist"
            diff <(echo "$EXPECTED") <(echo "$GOT") || true
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: snapttl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
