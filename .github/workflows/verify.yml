name: Verify

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests · lint · debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Clean-room core tests (Python mirror)
        run: python3 -m unittest discover -s tools -p 'clean_room_core_tests.py' -v

      - name: Unit tests (JUnit + Robolectric, SDK 30/34/35)
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee /tmp/unit-tests.log

      - name: Surface unit-test errors as annotations
        if: failure()
        run: |
          grep -aE "^e: |error: |Execution failed|What went wrong|Unresolved|Could not find|Caused by" \
            /tmp/unit-tests.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          find app/build/test-results -name "TEST-*.xml" -print0 2>/dev/null | while IFS= read -r -d '' f; do
            python3 - "$f" <<'PY'
import sys
import xml.etree.ElementTree as ET
try:
    tree = ET.parse(sys.argv[1])
except Exception:
    sys.exit(0)
for tc in tree.iter("testcase"):
    for fail in list(tc.iter("failure")) + list(tc.iter("error")):
        msg = ((fail.get("message") or "") + " " + (fail.text or ""))[:400].replace("\n", " | ")
        print(f"::error::FAILED {tc.get('classname')}.{tc.get('name')} :: {msg}")
PY
          done

      - name: Upload full unit-test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-log
          path: /tmp/unit-tests.log
          if-no-files-found: ignore

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --console=plain 2>&1 | tee /tmp/lint.log

      - name: Surface lint errors as annotations
        if: failure()
        run: |
          grep -aE "^e: |error: |Execution failed|What went wrong|Could not find" \
            /tmp/lint.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Room schema export
        run: |
          ./gradlew :app:kspDebugKotlin --no-daemon --console=plain
          test -f app/schemas/dev.snapttl.data.expiry.ExpiryDatabase/1.json
          test -f app/schemas/dev.snapttl.data.search.SearchIndexDatabase/1.json
          echo "--- Room schemas ---"
          ls -1 app/schemas/*/

      - name: Upload Room schemas
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: error

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Packaged permission audit
        run: |
          ./gradlew :app:processDebugMainManifest --no-daemon --console=plain
          echo "--- merged manifest permissions ---"
          GOT=$(grep -o 'android.permission\.[A-Z_]*' \
            app/build/intermediates/merged_manifest/debug/AndroidManifest.xml | sort -u)
          echo "$GOT"
          EXPECTED=$(printf '%s\n' \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_SPECIAL_USE \
            android.permission.POST_NOTIFICATIONS \
            android.permission.READ_MEDIA_IMAGES \
            android.permission.READ_MEDIA_VISUAL_USER_SELECTED \
            android.permission.READ_EXTERNAL_STORAGE \
            android.permission.RECEIVE_BOOT_COMPLETED \
            android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS \
            android.permission.SYSTEM_ALERT_WINDOW \
            android.permission.VIBRATE \
            android.permission.WAKE_LOCK | sort -u)
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::Packaged permission set drifted from the reviewed allowlist"
            diff <(echo "$EXPECTED") <(echo "$GOT") || true
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: snapttl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
