name: Verify

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests · lint · debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Clean-room core tests (Python mirror)
        run: python3 -m unittest discover -s tools -p 'clean_room_core_tests.py' -v

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Room schema export
        run: |
          ./gradlew :app:kspDebugKotlin --no-daemon
          test -f app/schemas/dev.snapttl.data.expiry.ExpiryDatabase/1.json
          test -f app/schemas/dev.snapttl.data.search.SearchIndexDatabase/1.json
          echo "--- Room schemas ---"
          ls -1 app/schemas

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Packaged permission audit
        run: |
          ./gradlew :app:processDebugMainManifest --no-daemon
          echo "--- merged manifest permissions ---"
          grep -o 'android.permission\.[A-Z_]*' \
            app/build/intermediates/merged_manifest/debug/AndroidManifest.xml | sort -u

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: snapttl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
