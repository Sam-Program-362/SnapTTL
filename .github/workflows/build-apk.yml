name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    name: Release APK (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble release (minified)
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Sanity-check APK contents
        run: |
          ls -l app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $APK"
          ${ANDROID_HOME}/build-tools/*/aapt dump badging "$APK" | head -5 || true
          echo "--- packaged permissions (must stay offline-first) ---"
          ${ANDROID_HOME}/build-tools/*/aapt dump permissions "$APK" || true

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: snapttl-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: snapttl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
