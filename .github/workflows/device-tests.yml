name: Device tests

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

jobs:
  device-tests:
    name: Connected tests · Android ${{ matrix.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 30
            android: "11"
          - api-level: 34
            android: "14"
          - api-level: 35
            android: "15"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-snapshot-save
          script: |
            adb shell settings put global window_animation_scale 0
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain > /tmp/connected.log 2>&1
            code=$?
            cat /tmp/connected.log
            exit $code

      - name: Surface connected-test errors as annotations
        if: failure()
        run: |
          grep -aE "^e: |error: |Execution failed|What went wrong|FAILED|Unresolved|Could not find|Tests on" \
            /tmp/connected.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload full connected-test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: connected-log-api${{ matrix.api-level }}
          path: /tmp/connected.log
          if-no-files-found: ignore

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports-api${{ matrix.api-level }}
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
